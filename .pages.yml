content:
  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{fields.slug}"
    fields:
      - name: title
        label: Title
        type: string
      - name: slug
        label: URL Slug
        type: string
      - name: date
        label: Date
        type: date
      - name: body
        label: Content
        type: rich-text