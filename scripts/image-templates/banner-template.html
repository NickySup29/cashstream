<!-- Approved design. 1600x893 (crops to 1200x630 for the og variant). Tokens filled by scripts/make-images.mjs: TITLE from the post's own title, TAGLINE from its answer box or meta description (never invented), ICON_SVG chosen by heroVariant. No photos, no people, no logos or government emblems. -->
<!DOCTYPE html><html><head><meta charset="utf-8"><style>
{{FONT_FACES}}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:893px;background:#274F23;font-family:I,sans-serif;color:#F8F8F3;position:relative;overflow:hidden}
.title{position:absolute;left:96px;right:620px;top:220px;font-family:F;font-weight:700;font-size:58px;line-height:1.1;letter-spacing:-.5px;color:#F8F8F3}
.tagline{position:absolute;left:96px;right:620px;top:470px;font-size:26px;line-height:1.4;color:#D7E3D4}
.brand{position:absolute;left:96px;bottom:56px;font-weight:700;font-size:22px;color:#92AB9F;letter-spacing:.02em}
.icon{position:absolute;right:120px;top:50%;transform:translateY(-50%);width:420px;height:420px}
</style></head><body>
<div class="title">{{TITLE}}</div>
<div class="tagline">{{TAGLINE}}</div>
<div class="brand">CASH STREAM ADVISORS</div>
<div class="icon">{{ICON_SVG}}</div>
</body></html>
