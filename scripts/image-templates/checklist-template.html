<!-- Approved design, same visual language as comparison/timeline templates. Width fixed at 1600px, height
     auto (rendered via renderPngAuto, which measures real content height so nothing clips). Two-column
     layout: tokens COL_A/COL_B are each a column's own <div class="item">... list, filled by
     scripts/make-images.mjs from the post's own docChecklist (first scenario) or a tagged comparisonTable
     column. Normal document flow throughout, no absolute positioning, so the browser's own layout decides
     height; never hand-edit the row count/height assumptions here. -->
<!DOCTYPE html><html><head><meta charset="utf-8"><style>
{{FONT_FACES}}
*{box-sizing:border-box;margin:0}
body{width:1600px;background:#F8F8F3;font-family:I,sans-serif;color:#1E2A1B}
h1{font-family:F;font-weight:700;color:#274F23;font-size:52px;text-align:center;padding:46px 80px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 40px;margin:40px 140px 0;background:#fff;border:1.5px solid #E3E2D8;border-radius:18px;padding:30px 44px}
.col{display:flex;flex-direction:column}
.item{display:flex;align-items:flex-start;gap:16px;padding:16px 0;border-bottom:1px solid #E3E2D8}
.col .item:last-child{border-bottom:none}
.tick{width:36px;height:36px;border-radius:9px;background:#EAF3E8;border:2px solid #274F23;flex-shrink:0;margin-top:2px}
.item.flag .tick{background:#FBEAEA;border-color:#B23B3B}
.d{font-size:32px;line-height:1.4;color:#2B3A28}
.badge{display:block;margin-top:8px;font-size:24px;font-weight:700;color:#B23B3B;background:#FBEAEA;border-radius:999px;padding:4px 16px;width:fit-content}
.band{margin:40px 0 0;padding:28px 80px;background:#66B760;font-weight:700;font-size:34px;color:#10240E;text-align:center;line-height:1.3}
.src{padding:26px 80px;font-size:26px;color:#5E7A69;text-align:center}
</style></head><body>
<h1>{{TITLE}}</h1>
<div class="grid">
<div class="col">{{COL_A}}</div>
<div class="col">{{COL_B}}</div>
</div>
<div class="band">{{BAND_TEXT}}</div>
<div class="src">{{SRC_TEXT}}</div>
</body></html>
