name = "cashstream"
main = "./src/worker.js"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
# Run the Worker before static assets so bots get snapshots on every route, including "/"
run_worker_first = true
not_found_handling = "single-page-application"
