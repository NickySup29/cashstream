<!-- Card-per-row layout for a comparisonTable with more than 2 value columns, where a traditional
     grid table would force tiny wrapped text into narrow columns. Width fixed at 1600px, height auto
     (rendered via renderPngAuto). Two-column card grid: tokens COL_A/COL_B are each a column's own
     <div class="card">... list, filled by scripts/make-images.mjs from the post's own comparisonTable.
     Normal document flow throughout, no absolute positioning. -->
<!DOCTYPE html><html><head><meta charset="utf-8"><style>
{{FONT_FACES}}
*{box-sizing:border-box;margin:0}
body{width:1600px;background:#F8F8F3;font-family:I,sans-serif;color:#1E2A1B}
h1{font-family:F;font-weight:700;color:#274F23;font-size:52px;text-align:center;padding:46px 80px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin:40px 80px 0}
.col{display:flex;flex-direction:column;gap:36px}
.card{background:#fff;border:1.5px solid #E3E2D8;border-radius:18px;padding:32px 36px}
.card h2{font-family:F;font-weight:700;font-size:34px;color:#274F23;margin-bottom:18px}
.field{padding:14px 0;border-top:1px solid #E3E2D8}
.card .field:first-of-type{border-top:none;padding-top:0}
.field .k{font-weight:700;font-size:20px;color:#4A6B45;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.field .v{font-size:28px;line-height:1.4;color:#2B3A28}
.band{margin:40px 0 0;padding:28px 80px;background:#66B760;font-weight:700;font-size:34px;color:#10240E;text-align:center;line-height:1.3}
.src{padding:26px 80px;font-size:26px;color:#5E7A69;text-align:center}
</style></head><body>
<h1>{{TITLE}}</h1>
<div class="grid">
<div class="col">{{COL_A}}</div>
<div class="col">{{COL_B}}</div>
</div>
<div class="band">{{BAND_TEXT}}</div>
<div class="src">{{SRC_TEXT}}</div>
</body></html>
