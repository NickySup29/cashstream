<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Google Analytics 4. Loaded on the production hostnames only, so localhost and
      // *.workers.dev previews send nothing. ?internal=1 marks this browser as internal
      // traffic (stored in localStorage), ?internal=0 clears it.
      (function () {
        var GA_ID = 'G-7WV0C64EDD';
        var internal = false;
        try {
          var flag = new URLSearchParams(window.location.search).get('internal');
          if (flag === '1') window.localStorage.setItem('csa_internal', '1');
          if (flag === '0') window.localStorage.removeItem('csa_internal');
          internal = window.localStorage.getItem('csa_internal') === '1';
        } catch (e) {}

        var host = window.location.hostname;
        if (host !== 'cashstreamadvisors.com' && host !== 'www.cashstreamadvisors.com') return;

        var tag = document.createElement('script');
        tag.async = true;
        tag.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(tag);

        window.dataLayer = window.dataLayer || [];
        window.gtag = function gtag() { window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', GA_ID, internal ? { traffic_type: 'internal' } : {});
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap"
    />
    <title>CashStream Advisors | Cross-Border Tax & Regulatory Experts</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
